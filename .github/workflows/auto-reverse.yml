name: Deep Binary Analysis + iOS Porting Workspace

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: deep-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze EXE/DLL files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            file \
            unzip \
            wget \
            openjdk-21-jdk \
            python3-dev

      - name: Install Python analysis libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pefile \
            capstone

      - name: Install radare2
        run: |
          if ! command -v r2 >/dev/null 2>&1; then
            sudo apt-get install -y radare2 || true
          fi

      - name: Download Ghidra
        env:
          GHIDRA_VERSION: "12.1.3"
        run: |
          mkdir -p "$RUNNER_TEMP/ghidra"

          wget -q \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_20260818.zip" \
            -O "$RUNNER_TEMP/ghidra/ghidra.zip"

          unzip -q \
            "$RUNNER_TEMP/ghidra/ghidra.zip" \
            -d "$RUNNER_TEMP/ghidra"

          GHIDRA_HOME="$(find "$RUNNER_TEMP/ghidra" -maxdepth 1 -type d -name "ghidra_*" | head -n 1)"

          if [ -z "$GHIDRA_HOME" ]; then
            echo "Ghidra directory was not found."
            exit 1
          fi

          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Verify analysis tools
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Ghidra:"
          "$GHIDRA_HOME/support/analyzeHeadless" -help >/dev/null

          echo "Other tools:"
          command -v strings || true
          command -v objdump || true
          command -v r2 || true

      - name: Run deep analysis
        env:
          GHIDRA_HOME: ${{ env.GHIDRA_HOME }}
        run: |
          python deep_reverse.py

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-analysis
          path: |
            analysis/
            ios_port/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated reports
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/ ios_port/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Automated binary analysis reports [skip ci]"
          git push
